name: Chat Lite quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # The agent harness validates itself, its guard hook and its eval
      # scenarios. Until now that only ran when someone remembered to run it,
      # which is the failure mode the checks exist to remove. It needs no
      # emulator and no browser, so it goes first and fails in seconds.
      - run: pnpm check:harness
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --coverage
      - run: pnpm test:functions
      - run: pnpm test:rules
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

name: Deploy Firebase production

on:
  workflow_dispatch:
    inputs:
      rollout_phase:
        description: Migration-safe deployment phase
        required: true
        type: choice
        default: additive_backend
        options:
          - additive_backend
          - notification_backend
          - push_ownership_backend
          - push_sender_backend
          - rtc_backend
          - ai_backend
          - feature_backend
          - additive_rules
          - hosting_client
          - restrictive_rules
          - full_post_migration
      migration_verified:
        description: Confirm backups, v3 migration and mirror validation are complete
        required: true
        type: boolean
        default: false
      providers_verified:
        description: Confirm provider secrets/configuration and staging smoke tests are complete
        required: true
        type: boolean
        default: false
      push_adoption_verified:
        description: Confirm Hosting adoption and canonical push ownership smoke tests are complete
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_REGION: ${{ vars.VITE_FIREBASE_REGION }}
      VITE_FCM_VAPID_KEY: ${{ vars.VITE_FCM_VAPID_KEY }}
      VITE_APP_CHECK_SITE_KEY: ${{ vars.VITE_APP_CHECK_SITE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:rules
      - name: Deploy selected rollout phase
        env:
          ROLLOUT_PHASE: ${{ inputs.rollout_phase }}
          MIGRATION_VERIFIED: ${{ inputs.migration_verified }}
        run: |
          # --force on the function phases: notifyOnMessage, syncMembershipMirror and
          # syncMessageSearchIndex declare retry: true, and the CLI refuses to deploy a
          # failure policy without an interactive confirmation there is nobody here to
          # give. Every phase is scoped by --only, so --force cannot delete a function
          # outside the list it was handed.
          MEMBERSHIP_FUNCTIONS="functions:createDirectRoom,functions:createOrJoinPublicRoom,functions:revokeRoomMember,functions:syncMembershipMirror,functions:reconcileMembershipMirrors"
          PUSH_OWNERSHIP_FUNCTIONS="functions:claimPushToken,functions:releasePushToken,functions:cleanupStalePushTokens"
          PUSH_SENDER_FUNCTIONS="functions:notifyOnMessage,functions:syncCallSignals"
          NOTIFICATION_FUNCTIONS="$PUSH_OWNERSHIP_FUNCTIONS,functions:notifyOnMessage,functions:sendStickerMessage"
          RTC_FUNCTIONS="functions:startLiveKitCallV2,functions:getLiveKitTokenV2,functions:confirmLiveKitCall,functions:respondLiveKitCall,functions:heartbeatLiveKitCall,functions:failLiveKitCall,functions:endLiveKitCallV2,functions:cleanupStaleLiveKitCalls,functions:cleanupExpiredCallSignals"
          AI_FUNCTIONS="functions:generateGeminiReply,functions:cleanupExpiredAIDrafts"
          V3_FUNCTIONS="$MEMBERSHIP_FUNCTIONS,$RTC_FUNCTIONS,$NOTIFICATION_FUNCTIONS,functions:syncCallSignals,functions:generateGeminiReply,functions:cleanupExpiredAIDrafts,functions:cleanupExpiredUploads,functions:cleanupOrphanR2Objects,functions:finalizeUpload,functions:getAttachmentDownloadUrl,functions:requestUpload,functions:searchMessages,functions:syncMessageSearchIndex,functions:cleanupExpiredCustomStickerUploads,functions:deleteCustomSticker,functions:finalizeCustomStickerUpload,functions:getCustomStickerDownloadUrl,functions:requestCustomStickerUpload"
          case "$ROLLOUT_PHASE" in
            additive_backend)
              pnpm exec firebase deploy --project f-chat-wayde-fu --force --only "firestore:indexes,$MEMBERSHIP_FUNCTIONS"
              ;;
            notification_backend)
              # Backward-compatible phase name. It now establishes ownership before
              # the canonical sender is enabled; use push_sender_backend after adoption.
              test "$MIGRATION_VERIFIED" = "true"
              pnpm exec firebase deploy --project f-chat-wayde-fu --force --only "$PUSH_OWNERSHIP_FUNCTIONS,functions:sendStickerMessage"
              ;;
            push_ownership_backend)
              test "$MIGRATION_VERIFIED" = "true"
              pnpm exec firebase deploy --project f-chat-wayde-fu --force --only "$PUSH_OWNERSHIP_FUNCTIONS"
              ;;
            push_sender_backend)
              test "$MIGRATION_VERIFIED" = "true"
              test "${{ inputs.push_adoption_verified }}" = "true"
              pnpm exec firebase deploy --project f-chat-wayde-fu --force --only "$PUSH_SENDER_FUNCTIONS"
              ;;
            rtc_backend)
              # Scoped provider gate: this attests LiveKit only. feature_backend
              # keeps the whole-fleet gate for the phase that deploys all of them.
              # No push gate: syncCallSignals is the only RTC Function that reads
              # the canonical push registry, and it ships in push_sender_backend
              # after adoption. The call state machine has to precede the Hosting
              # client that calls it, which is before adoption can be measured.
              test "$MIGRATION_VERIFIED" = "true"
              test "${{ inputs.providers_verified }}" = "true"
              # Indexes ship with the Functions that query them. cleanupStaleLiveKitCalls
              # queries calls by status + leaseExpiresAt and status + startedAt, and both
              # composite indexes are declared in firestore.indexes.json. Deploying this
              # phase without them leaves the scheduled stale-call recovery failing every
              # run with FAILED_PRECONDITION, which is exactly the recovery path this
              # backend exists to provide. additive_backend was the only phase carrying
              # indexes, and nothing in the RTC runbook order requires it to run first.
              pnpm exec firebase deploy --project f-chat-wayde-fu --force --only "firestore:indexes,$RTC_FUNCTIONS"
              ;;
            ai_backend)
              # Scoped provider gate: this attests Gemini only. The generation
              # Function needs GEMINI_API_KEY, and cleanupExpiredAIDrafts only
              # has drafts to clear once generation is running, so they ship
              # together.
              test "$MIGRATION_VERIFIED" = "true"
              test "${{ inputs.providers_verified }}" = "true"
              pnpm exec firebase deploy --project f-chat-wayde-fu --force --only "$AI_FUNCTIONS"
              ;;
            feature_backend)
              test "$MIGRATION_VERIFIED" = "true"
              test "${{ inputs.providers_verified }}" = "true"
              test "${{ inputs.push_adoption_verified }}" = "true"
              pnpm exec firebase deploy --project f-chat-wayde-fu --force --only "$V3_FUNCTIONS"
              ;;
            additive_rules)
              # RTDB only. The new client writes global presence instead of the
              # legacy room presence path, so that rule has to exist before
              # hosting_client. database.rules.json keeps the legacy path, so an
              # old client keeps working. Firestore Rules are not deployed here:
              # the same file now denies client pushTokens writes, which must not
              # land until push adoption is verified.
              test "$MIGRATION_VERIFIED" = "true"
              pnpm exec firebase deploy --project f-chat-wayde-fu --only database
              ;;
            hosting_client)
              # No provider gate here. This phase ships only the client bundle; the
              # provider backends deploy in feature_backend, which checks it there.
              test "$MIGRATION_VERIFIED" = "true"
              test -n "$VITE_FCM_VAPID_KEY"
              test -n "$VITE_APP_CHECK_SITE_KEY"
              pnpm exec firebase deploy --project f-chat-wayde-fu --only hosting
              ;;
            restrictive_rules)
              test "$MIGRATION_VERIFIED" = "true"
              test "${{ inputs.push_adoption_verified }}" = "true"
              pnpm exec firebase deploy --project f-chat-wayde-fu --only firestore:rules,database
              ;;
            full_post_migration)
              test "$MIGRATION_VERIFIED" = "true"
              test "${{ inputs.providers_verified }}" = "true"
              test "${{ inputs.push_adoption_verified }}" = "true"
              test -n "$VITE_FCM_VAPID_KEY"
              test -n "$VITE_APP_CHECK_SITE_KEY"
              pnpm exec firebase deploy --project f-chat-wayde-fu --force --only "firestore:rules,firestore:indexes,database,hosting,$V3_FUNCTIONS"
              ;;
          esac
